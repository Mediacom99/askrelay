g     *Ring            // in-memory scrollback, cap from --ring-size (§5)\n    room     RoomHandle       // narrow interface over *p2p.Room (testability)\n    state    Phase            // Connecting | Alone | Chatting | TooNarrow\n    profile  colorprofile.Profile // from tea.ColorProfileMsg → T-22 warning\n    width, height int\n    renderer MessageRenderer  // §5/§9 pluggable-renderer seam\n}\n\n// MessageRenderer is the §9 hook: v2 widgets/pipe blocks implement this.\ntype MessageRenderer interface {\n    Render(m Message, width int) string\n}\n\ntype Ring struct{ ... }        // fixed-cap slice, evict-oldest; no disk, ever\nfunc NewRing(cap int) *Ring    // default 200 (§5); --ring-size (§6)\n```\n\n`cmd/pchat/main.go` order: parse flags (`--room`, `--ring-size`, `--relay-only`,\n`--debug`, `--version` — the §6 set + version) → resolve passphrase (T-14 chain;\n`--room -` uses `term.ReadPassword`; none ⇒ commons per P-01) → banner to stderr\n*before* alt-screen (\"pchat — ephemeral p2p chat · nothing is stored · IPs may be\nvisible to peers: see threat model\" — one line, P-03) → `identity.GenerateKeypair`\n→ `p2p.NewHost` → `JoinRoom` → `NewDiscovery(mdns, [dht], [rendezvous]).Run` (sources\npresent as their packages land — this main wires whatever exists) → bridge goroutine:\n`for ev := range room.Events() { prog.Send(ev) }` with small-batch coalescing →\n`tea.NewProgram(model, tea.WithFilter(leaveFirstFilter))`.\n\n**Implementation notes (verified):**\n- `Program.Send` blocks before `Run()` starts and no-ops after quit — start the\n  bridge goroutine right before `prog.Run()`, and route the leave broadcast through\n  `Update`/filter, never through `Send` at teardown (T-15).\n- Ctrl+C arrives as `tea.KeyPressMsg` (`\"ctrl+c\"`) — handle → `room.Leave(ctx500ms)`\n  → `tea.Quit`. The `tea.WithFilter` catches external SIGINT/SIGTERM\n  (`tea.InterruptMsg`/`QuitMsg` never reach `Update` otherwise — verified).\n- Onboarding states (§11/§14): `Connecting` shows per-source status from\n  `SourceStatus` (\"mdns: listening · dht: bootstrapping…\"); `Alone` shows\n  \"room is empty — messages wait for someone to arrive\" (+ commons hint if in\n  commons); transition to `Chatting` on first `PeerEvent`. Never a blank screen.\n- Send-state (T-18): local echo renders immediately from the self-delivery event;\n  marker `·` (pending, `PeerCount()==0`) / `✓` (sent) / `✗` (failed) in the gutter.\n- Resize: every `tea.WindowSizeMsg` re-lays-out (initial one is guaranteed on TTYs —\n  verified); `TooNarrow` below 40×8 (T-24; roster rules land with WP-09).\n- Mouse: nothing enabled (`View.MouseMode` zero value) — T-23; alt-screen on.\n- `--version`: print ldflags version, falling back to\n  `runtime/debug.ReadBuildInfo().Main.Version` (go-install builds have no ldflags —\n  verified).\n\n**Acceptance criteria:**\n1. Two terminals on one machine (mDNS): full chat both ways; glyphs+colors render;\n   own messages echo exactly once.\n2. Onboarding: launching alone shows the discovery status line, never a blank pane.\n3. Ctrl+C in one terminal → the other logs an explicit leave (T-16 path) — verify\n   with WP-04's headless peer if WP-09's roster UI isn't there yet.\n4. Resize during chat reflows (SoftWrap) without garbling; 39-col terminal shows the\n   TooNarrow notice and recovers on widen.\n5. `pchat` with no room joins the commons (P-01); `--room -` prompts with echo off;\n   `PCHAT_ROOM` works; passphrase never appears in the UI.\n6. Zero disk writes (`Ring` is the only history; no config/cache files created).\n\n**Test plan:** `Ring` + model-update unit tests (pure; feed `tea.Msg`s, assert view\nstrings); wiring smoke-tested manually per acceptance (recorded in PR); `-race` on\nthe bridge (headless: model against a fake RoomHandle).\n\n---\n\n### WP-09 — roster, presence, typing, mute, churn\n\n**Status:** TODO · **Depends on:** WP-08 · **Gated by:** T-16 T-17 T-19 P-02 ·\n**Spec:** §5 (roster/typing), §11 (churn), §12 (mute).\n\n**Goal:** the social layer: who's here, who's typing, who left vs dropped, and the\nlocal mute mechanism.\n\n**Files:** `internal/ui/roster.go` (replace placeholder), edits to `model.go` /\n`room_view.go`; `internal/p2p/room.go` gains nothing new (all events exist since\nWP-04 — this is UI work plus the mute filter hookup).\n\n**Key behavior:**\n- Roster sidebar (right, width 12, hidden <70 cols per T-24): glyphs of present\n  peers, self first, muted peers greyed + ⊘, colliding identities auto-suffixed\n  (T-30 `Short()`).\n- System lines in the room pane: \"◆ joined\", \"◆ left\", \"◆ lost connection\" (T-16),\n  \"⟡'s messages use an incompatible protocol version — hidden\" (T-19, once/peer).\n- Typing: `TypingEvent` renders a pulsing glyph strip above the input; auto-expire\n  4 s (T-17); sending own typing: `started` at most every 4 s while editing,\n  `stopped` on send/clear.\n- Mute (P-02 mechanism): `room.Mute(pub, true)` — chat + typing from that pubkey\n  filtered at the model boundary; roster keeps the peer visible (muted ≠ invisible:\n  users should see who they've muted). Command surface arrives in WP-10.\n\n**Acceptance criteria:**\n1. 3-instance LAN session: roster consistent on all three within 20 s of any change\n   (join, leave, kill -9).\n2. kill -9 shows \"lost connection\" on peers; clean quit shows \"left\".\n3. Typing indicator appears/expires; no self-typing echo.\n4. Muted peer's messages stop rendering immediately; unmute resumes (new messages\n   only — no retroactive reveal/unreveal of ring content is required in v1).\n\n**Test plan:** model-level tests with synthetic event sequences (roster state\nmachine, mute filter, typing expiry with fake clock); manual 3-instance pass\nrecorded.\n\n---\n\n### WP-10 — command system + UX polish\n\n**Status:** TODO · **Depends on:** WP-09 · **Gated by:** T-24 P-01 P-04 P-07 ·\n**Spec:** §5, §11 (empty input), §14 (discoverability), §15 (prod command surface).\n\n**Goal:** the complete v1 command surface and the last UX gaps: `/help`, `/who`,\n`/mute`, `/unmute`, `/quit`; placeholder hint; empty-input trim; commons banner+AUP;\nmin-width behavior finalized.\n\n**Files:** `internal/ui/commands.go` (new — T-28), edits to `input.go`/`model.go`.\n\n**Key shapes:**\n\n```go\n// Command dispatch: input starting with \"/\" is parsed, everything else is chat.\ntype Command struct{ Name string; Args []string }\nfunc ParseCommand(line string) (Command, bool)\n// v1 surface (§15 prod list — exactly this, nothing more in prod builds):\n//   /help          — command list + one-line privacy reminder\n//   /who           — roster with indices (the /mute handles)\n//   /mute <n>, /unmute <n>\n//   /quit          — same path as ctrl+c (T-15)\n// Dev builds add /debug ... via a build-tagged registration hook (WP-11).\n```\n\n- Input placeholder: `type a message — /help for commands` (P-07).\n- Empty/whitespace-only input: trimmed, never published (§11) — unit-tested.\n- Unknown command: local error line, not sent as chat (prevents the classic\n  \"/mute leaked into the room\" embarrassment). A leading `//` escapes to send a\n  literal `/`.\n- Commons banner (P-01): persistent single line when in the commons, linking\n  `docs/commons-room.md` (P-04) via `/help`.\n- Chat text length: pre-publish check (T-04) surfaces \"message too long (N/4000\n  bytes)\" inline instead of silently failing.\n\n**Acceptance criteria:** each command behaves per above in a live 2-instance session;\n`/mute` indices match `/who`; unknown `/foo` never publishes; placeholder visible on\nempty input; `//literal` sends `/literal`.\n\n**Test plan:** `ParseCommand` table tests; command→model behavior tests; manual pass.\n\n---\n\n### WP-11 — dev/prod build split (§15)\n\n**Status:** TODO · **Depends on:** WP-08 · **Gated by:** T-25 T-26 · **Spec:** §15\n(entire section).\n\n**Goal:** complete §15: full dev instrumentation behind `//go:build dev`, prod-purity\nenforcement in CI, Makefile targets. (The logging shim exist oal:** tagged pushes produce signed, verifiable, reproducible-by-design release\nartifacts for both binaries; supply-chain hygiene automated.\n\n**Files:** `.goreleaser.yaml`, `.github/workflows/release.yml`,\n`.github/dependabot.yml`, README install/verify section stub (final prose in WP-13).\n\n**Key content (versions verified 2026-07-09):**\n- `.goreleaser.yaml` (`version: 2`, goreleaser v2.17.0): two builds —\n  `pchat` (darwin/linux × amd64/arm64 + windows/amd64) and `pchat-point`\n  (linux × amd64/arm64); `env: [CGO_ENABLED=0]`, `flags: [-trimpath]`,\n  `ldflags: -s -w -X main.version={{.Version}} -X <pkg>.defaultPointAddr={{.Env.PCHAT_POINT_ADDR}}`\n  (T-11), `mod_timestamp: '{{ .CommitTimestamp }}'` (reproducibility — verified\n  bit-for-bit across runs), zip for windows / tar.gz otherwise, `checksums.txt`.\n  **No build tags** on release builds — prod is the absence of `dev` (verified\n  `builds[].tags` semantics).\n- `release.yml`: trigger `push: tags: [v*]`; permissions `contents: write`,\n  `id-token: write`, `attestations: write`; `actions/checkout@v7` with\n  `fetch-depth: 0`; `actions/setup-go@v6` (`go-version-file: go.mod`);\n  `sigstore/cosign-installer@v4` **before** goreleaser;\n  `goreleaser/goreleaser-action@v7` (`version: \"~> v2\"`); then `ci/check_prod.sh\n  dist/...` (purity gate on the real artifacts); then\n  `actions/attest-build-provenance@v4` with `subject-checksums: dist/checksums.txt`.\n- Signing (T-27): goreleaser `signs` block → `cosign sign-blob --bundle\n  checksums.txt.sigstore.json` (keyless; the modern bundle format — verified\n  required in cosign v3).\n- `dependabot.yml`: gomod + github-actions, weekly (supply-chain hygiene, §13).\n- `go install github.com/Mediacom99/pchat/cmd/pchat@latest` must keep working:\n  **no replace directives ever** (verified: any replace breaks go-install; the\n  rendezvous fork needs none) — add a CI grep asserting go.mod contains none.\n\n**Acceptance criteria:**\n1. `goreleaser check` + `goreleaser release --snapshot --clean` green in CI (dry-run\n   job on PRs touching release files).\n2. A real pre-release tag (e.g. `v0.0.1-rc1`) produces: 7 archives, checksums,\n   `.sigstore.json` bundle, attestation — and the README verify commands (cosign +\n   `gh attestation verify` + `sha256sum -c`) all pass against the downloaded\n   artifacts, executed and recorded.\n3. `check_prod.sh` gates the workflow (inject a canary into a scratch branch build\n   once to watch it fail — recorded).\n4. `go install …@latest` on a clean container builds a working prod binary;\n   `--version` reports the module version (ReadBuildInfo fallback).\n\n**Test plan:** the rc-tag dry run *is* the test; keep it as a repeatable checklist in\nthe PR description.\n\n---\n\n### WP-13 — README, threat model, positioning, AUP\n\n**Status:** TODO · **Depends on:** — (docs; needs decision verdicts, not code) ·\n**Gated by:** T-01 P-01 P-02 P-03 P-04 P-06 P-08 · **Spec:** §7, §13, §14, §16,\nlaunch checklist (\"Before you post anywhere\").\n\n**Goal:** the honesty layer: README restructured per the launch checklist, a\nuser-language threat model, the commons AUP, and consistency fixes (SECURITY.md\nstill describes the pre-T-01 signing design).\n\n**Files:** `README.md` (restructure), `docs/threat-model.md` (new),\n`docs/commons-room.md` (new), `SECURITY.md` (update), `CLAUDE.md` (touch-ups if\ndrifted).\n\n**README order (launch checklist, verbatim requirement):** (1) one-sentence hook —\nproposed: *\"A chat room that stops existing when the last person leaves.\"*; (2)\nterminal recording placeholder (asciinema — recorded in WP-14 when the real thing\nworks); (3) install: release binaries + verify commands (from WP-12) + `go install`\none-liner; (4) usage with the commons passphrase called out (`pchat` → the commons;\n`pchat --room \"…\"`), **immediately followed by** the IP-exposure caveat in user\nlanguage (P-03 — including the \"up to ~48 h after you leave\" sharpening and\n\"treat passphrases like invite links, not passwords\"); then sharing-a-room note\n(§11), positioning paragraph (P-03: what pchat is *not* — no history, no accounts,\nno way to find the same person tomorrow), links.\n\n**threat-model.md contents (§7 + §13 in user language, each with \"what this means\nfor you\"):** protected: impersonation-within-room (via transport signing, T-01\nwording), casual room discovery. Not protected: participants who log/screenshot;\ntraffic analysis/no Tor; weak-passphrase brute force ⇒ room discovery **and**\nparticipant IP harvesting via the public DHT (mechanics: provider records; linger\n≤48 h; the ~20 closest DHT servers see participant IPs without any passphrase;\nrelayed peers expose the relay's IP instead — the one free partial mitigation);\nrendezvous operator sees registrations + IPs (§3 trust tradeoff, stated as\nfirst-party: \"we run this server; here is exactly what it can see\"); Sybil (P-08);\nreplay bounded to ±10 min (T-05); passphrase in `ps` when using `--room` (T-14\nalternatives listed); mDNS advertises \"a pchat user is on this LAN\" (T-13). Plus the\nabuse stance (P-02): no bans possible, mute is local, commons AUP link.\n\n**SECURITY.md:** replace the \"Ed25519 signatures over every wire message\" framing\nwith the T-01 reality (transport-layer signing via libp2p pubsub; validator-enforced\nfreshness/caps); reporting flow unchanged.\n\n**Acceptance criteria:** README top-to-bottom follows the checklist order; every\nthreat-model claim traces to a decision or a verified research fact (no aspirational\nsecurity prose); a cold reader can execute install + verify + join-commons from the\nREADME alone; SECURITY.md no longer references envelope signatures.\n\n**Test plan:** docs — review-only; run a link checker; have a fresh session read\nREADME and list every claim not yet true of the build (that list must be empty at\nWP-14).\n\n---\n\n### WP-14 — platform matrix + launch verification\n\n**Status:** TODO · **Depends on:** WP-05 WP-06 WP-10 WP-12 WP-13 + WP-07 deployed ·\n**Gated by:** T-22; **launch additionally gated by P-05 (legal consult) being done** ·\n**Spec:** §11 (terminal compat), §13 (2–3 peer testing), §16 (Windows), launch\nchecklist.\n\n**Goal:** the recorded, executed verification pass that gates launch — this package\nproduces *evidence*, not code (fixes it uncovers are follow-up punch-list items,\neach a small PR).\n\n**Files:** `docs/testing-matrix.md` (protocol + results).\n\n**Matrix (execute and record each cell):**\n\n| Dimension | Cells |\n|---|---|\n| Terminals | iTerm2, Terminal.app, Windows Terminal, conhost (cmd + PowerShell — §16 insists all three Windows shells), gnome-terminal, raw Linux tty |\n| Per terminal | glyph set renders (no tofu), 256-color vs degraded profile warning (T-22), resize reflow, mouse-off text selection works, alt-screen restore on exit |\n| Network scenarios | LAN/mDNS only; cross-network via deployed point (rendezvous); point stopped → DHT fallback finds peers (measure latency); `--relay-only` end-to-end through the VPS; both peers NAT'd (hole-punch attempt + relay fallback) |\n| Scale | 2-peer and 3-peer real-machine sessions (the §13 requirement, on real networks not just the in-process tests) |\n| Install | `go install …@latest` on a clean container; release binary + all three verify paths on macOS/Linux/Windows |\n| Longevity | 1-hour idle session survives (keepalives, rendezvous refresh, no fd creep — watch dev metrics) |\n\n**Also in this package:** record the asciinema/GIF for the README (launch checklist\nasset); final pass of the launch checklist's \"Before you post anywhere\" engineering\nitems with links to evidence.\n\n**Acceptance criteria:** every matrix cell has a recorded result; every failure has\na filed punch-list item (and blockers are fixed before this WP is DONE); the launch\nchecklist engineering section is checkable with evidence links; P-05 confirmed done\nby the maintainer before this package is marked DONE.\n\n---\n\n## 7. Learnings log\n\nAppend-only. Every entry: date, what was learned, which packages/decisions it\nchanged. Seeded with what the 2026-07-09 research pass corrected:\n\n- **2026-07-09 — CLAUDE.md's rendezvous-fork cgo claim was wrong.** Verified via\n  `go list -deps`: the fork's *root* package pulls neither sqlite nor `database/sql`;\n  the cgo drivers live in `db/sqlite`/`db/sqlcipher` subpackages. There is no\n  \"narrow client import\" to find — the root *is* the client package (and also the\n  server, cleanly, via a storage interface). CLAUDE.md corrected in the plan's\n  commit. → T-12, WP-06, WP-07.\n- **2026-07-09 — The Charm stack went v2-stable (2026-02-24) at new `charm.land/*`\n  import paths;** CLAUDE.md's bubbletea v1.3.10 / lipgloss v1.1.0 pins are the\n  frozen legacy line, and `bubbles` was missing from the table entirely. Windows\n  resize regression in v2 fixed at v2.0.7 → pin v2.0.8. → T-31, WP-08, §3 matrix.\n- **2026-07-09 — go-libp2p-pubsub v0.17.0 released this very day** (protobuf\n  migration); staying on v0.16.0 (proven against go-libp2p v0.48.0 by compile+run).\n  → T-32.\n- **2026-07-09 — Circuit relay v2 default limits are 2 min / 128 KiB per circuit**\n  (verified in source): unusable for relay-fallback chat; the point must raise them.\n  Also: stale doc comment there (`MaxReservationsPerPeer` \"4\" — code says 1);\n  trust code, not comments. → T-29, WP-07.\n- **2026-07-09 — `go tool nm` is unusable for the §15 prod-purity check** (stripped\n  binaries have no symbol table; inlining erases small dev funcs even unstripped) —\n  verified empirically; `go version -m` build-tag inspection + used-canary-string\n  scan both survive `-s -w` on all five target platforms. §15's own suggested\n  mechanism corrected. → T-26, WP-11, WP-12.\n- **2026-07-09 — cosign v3 made `--bundle` mandatory for `sign-blob`**: one\n  `.sigstore.json` per artifact; the `.sig`+`.pem` two-file layout in older docs is\n  legacy. `gh attestation verify` requires GitHub auth even for public repos\n  (verified logged-out) — disqualifies attestations as *primary* verification for\n  this audience. → T-27, WP-12.\n- **2026-07-09 — DHT reality sharpened:** provider records linger ≤48 h after leave\n  (nothing un-provides); the ~20 closest Amino servers see participant IPs without\n  any passphrase; advertising before reachability is confirmed publishes undialable\n  junk (or errors); custom-prefix DHT would need our own bootstrap network\n  (maintainer-confirmed upstream). → T-09, WP-05, WP-13 threat model.\n- **2026-07-09 — gossipsub verified at small scale:** mesh below Dlo = full clique\n  (graceful); flood-publish is OFF by default (must enable — closes the ~1 s\n  fresh-join miss window); peer scoring entirely off by default; `Publish` returns\n  nil at zero peers (silent); self-delivery is real and `Message.Local` does *not*\n  mean \"mine\". → T-08, T-18, WP-04, WP-08.\n\n---\n\n## 8. Risk register\n\nRisks that could genuinely sink v1 — each with its mitigation *packaged*, not\nadvised:\n\n- **R1 — Real-world NAT traversal fails** (hole-punch success is probabilistic;\n  relay misconfig turns \"p2p chat\" into \"doesn't connect\"). *Packaged:* WP-07\n  scheduled immediately after the MVP with chat-viable relay limits (T-29) and a\n  real deployment; `--relay-only` escape hatch exists from WP-03; WP-14's network\n  matrix exercises hole-punch, relay fallback, and double-NAT before anyone\n  launches; onboarding UI states (WP-08) make failures legible instead of silent.\n- **R2 — The rendezvous fork rots out from under us** (no tags, last commit\n  2024-01). *Packaged:* WP-06 opens with a ≤1 h compile-and-run spike; the T-12\n  contingency (DHT+mDNS-only v1) is **pre-approved** so no session stalls waiting\n  for a maintainer decision; research already proved today's pin works against\n  go-libp2p v0.48.0.\n- **R3 — Gossipsub misbehaves exactly at our dominant scale (2–3 peers).**\n  *Packaged:* verified-by-source analysis , "file": "docs/pchat-architecture.md", "md": "# pchat — Architecture Document (v1)\n\nA terminal-only, fully P2P, ephemeral chat tool for developers and internet weirdos.\nNo servers, no accounts, no logs. You exist in a room only while you're in it.\n\n---\n\n## 1. Design Principles\n\n- **Ephemeral by default.** Nothing touches disk. No history, no logs, no saved identity.\n- **No central server.** Rooms exist only as long as at least one peer holding them is online.\n- **Minimal wire footprint.** Every byte on the wire should earn its place.\n- **Identity is anonymous but distinguishable.** You don't get a name — you get a signature.\n- **v1 = core chat only.** Pipe support, code sandbox, widgets, drift mode, Tor — all deferred to v2+. Don't build them now; just don't architect anything that blocks adding them later.\n\n---\n\n## 2. Identity\n\n- **Keypair:** Ed25519, generated fresh on every process launch. Never written to disk.\n- **Peer ID:** derived the standard libp2p way (multihash of the public key).\n- **Signature glyph:** deterministically derived from the pubkey bytes —\n  - Take first N bytes of `SHA-256(pubkey)`.\n  - Map to: one ASCII/Unicode glyph from a curated symbol set + one 256-color terminal color code.\n  - Same pubkey always → same glyph+color for that session. Different launch → different keypair → different glyph.\n- No nicknames in v1. Recognition in a room is purely visual (glyph + color), reinforcing the \"faces without names\" feel.\n\n---\n\n## 3. Networking\n\n**Base layer:** go-libp2p\n\n- **Transports:** TCP + QUIC (QUIC preferred when available — faster handshake, built-in encryption).\n- **Security:** Noise protocol (libp2p default).\n- **NAT traversal:**\n  - AutoNAT for detecting reachability.\n  - Circuit relay v2 as fallback for peers behind symmetric NATs / strict firewalls.\n  - Hole punching (DCUtR) attempted before falling back to relay.\n- **Peer discovery (v1 = LAN + internet):**\n  - **Rendezvous point (primary, v1):** a lightweight VPS running `go-libp2p-rendezvous`. Peers `Register` under a namespace equal to `topic_id` (see below) with a short TTL, and `Discover` other peers registered under the same namespace, receiving back full multiaddr info (not just a raw IP) so direct dialing can follow. Use the existing library rather than a custom HTTP endpoint — it already returns NAT-aware address info correctly.\n    - As a side effect, the VPS observes each peer's real public IP:port during registration, which can be used to coordinate a hole-punch attempt (DCUtR) between two NAT'd peers immediately after a `Discover` match — effectively a free lightweight STUN role, layered on top of its rendezvous job.\n    - The same VPS doubles as a **Circuit Relay v2** fallback for peers behind symmetric NATs where hole punching won't succeed. Budget relay bandwidth separately from rendezvous traffic — registration/lookup is tiny (KBs), relay is proxying real chat traffic for the life of a connection.\n    - **No persistent storage on the rendezvous VPS.** Registrations are TTL-based and should live fully in memory, matching the project's no-logs ethos — this component should not become the one piece of infrastructure that quietly writes anything to disk.\n    - Firewall the VPS to only the rendezvous/relay port; nothing else exposed.\n  - **mDNS** for same-LAN discovery (instant, zero-config), kept as a fallback path independent of the VPS.\n  - **Kademlia DHT** kept as a second fallback — slower to bootstrap but fully decentralized, so discovery still works if the rendezvous VPS is ever down.\n  - **Client discovery order:** rendezvous (fast) → DHT (slower, resilient) → mDNS (LAN-only), falling through automatically if a method fails or times out.\n  - **Trust tradeoff to be explicit about:** the rendezvous VPS operator sees which peers register under which room-topic hashes, plus their real IPs — this is a more centralized point of metadata exposure than pure DHT discovery (where that knowledge is naturally sharded across many nodes). Message *content* still never touches the VPS and remains Noise-encrypted end-to-end, but this should be stated plainly to users, not left implicit.\n\n**Rooms:**\n- A room = a **topic string**, never transmitted in plaintext.\n- `topic_id = SHA-256(room_passphrase)`\n- Peers use `topic_id` both as the **gossipsub topic** and as the **DHT lookup key** to find other peers in the same room.\n- No passphrase = no way to find or join a room. This is the entire access-control model for v1 — deliberately simple.\n- Messaging fan-out via **gossipsub** (libp2p pubsub).\n\n**Explicitly out of scope for v1:** proof-of-work join gating, Tor/onion transport. Both are clean additions later (PoW as a pubsub validator function, Tor as an alternate transport) — leave hooks but don't build them now.\n\n---\n\n## 4. Wire Protocol\n\n**Format: CBOR** (Concise Binary Object Representation).\n\nWhy CBOR over raw custom binary or Protobuf:\n- Binary and compact — smaller than JSON, comparable to Protobuf for small messages.\n- Self-describing (no separate `.proto` compilation step), which keeps the project easy for outside devs to write bot/alt clients against — they just need the CBOR spec, not your build tooling.\n- Mature Go library: `fxamacker/cbor`.\n\nIf you later want the absolute smallest possible payload (e.g. for very high-frequency presence/cursor updates), a hand-rolled fixed-width binary format is the next step down — but CBOR is the right tradeoff for v1 between tiny and maintainable.\n\n**Message envelope (all messages share this shape):**\n\n```\nMessage {\n  v         uint8       // protocol version, starts at 1\n  type      uint8       // 0=chat, 1=presence, 2=typing  (widget/file-chunk reserved: 3, 4...)\n  sender    bytes       // sender pubkey (32 bytes, Ed25519)\n  ts        uint64      // unix millis, sender-local clock, informational only\n  sig       bytes       // Ed25519 signature over (v|type|sender|ts|payload)\n  payload   bytes       // type-specific CBOR-encoded body\n}\n```\n\n**Payload types (v1):**\n- `chat`: `{ text: string }`\n- `presence`: `{ state: uint8 }` (0=joined, 1=left)\n- `typing`: `{ state: uint8 }` (0=started, 1=stopped)\n\n**Versioning:** the `v` field lets future clients detect and reject/ignore messages from incompatible protocol versions rather than crashing on unknown fields.\n\n**Signing:** every message is signed with the sender's session privkey. Peers verify `sig` before rendering/relaying. This doesn't prevent a malicious peer from lying about content, but it does prevent impersonation of another peer's glyph/identity within a session.\n\n---\n\n## 5. Terminal UI\n\n**Framework:** Bubbletea (charmbracelet) + Lipgloss for styling.\n\n**Layout (v1):**\n- **Room pane:** scrolling message view. Each line prefixed with sender's glyph+color.\n- **Input bar:** single-line input at the bottom.\n- **Roster (optional, thin sidebar or top bar):** glyphs of currently present peers.\n- **Typing indicator:** small ephemeral marker (e.g. a peer's glyph pulsing) — driven by `typing` messages.\n\n**Ephemeral scrollback:**\n- In-memory ring buffer, default cap **200 messages** per room, configurable via flag.\n- Nothing is ever flushed to disk. Exiting the app == total loss of history, by design.\n\n**Accessibility & legibility:**\n- **Colorblind-safe palette:** glyph color must be derived from a curated, tested-distinct subset of the 256-color space — not the raw hash output — so peers remain distinguishable for colorblind users (~8% of men). Color should never be the *only* differentiator; pair it with a genuinely distinct glyph shape, not just color variants of the same symbol.\n- **Glyph font compatibility:** the curated glyph/symbol set needs a legibility pass across common terminal fonts (Menlo, Consolas, JetBrains Mono, default Windows Terminal font) before being locked in, to avoid tofu/box rendering on some setups.\n\n**Message delivery feedback:**\n- Sent messages need a visible state distinction: pending (published locally, not yet confirmed) vs. confirmed vs. failed. On flaky connections, silent uncertainty reads as a broken app — don't let \"did that even send?\" be an open question for the user.\n\n**Resize & narrow-terminal behavior:**\n- Explicit handling for `SIGWINCH` (terminal resize) mid-session — scrollback reflow and roster truncation need real testing, not an assumption that Bubbletea degrades gracefully by default.\n- Define a minimum-width behavior (e.g. below ~60 cols): does the roster hide, do glyphs abbreviate, or does layout break? Pick one on purpose.\n\n**Mouse mode:**\n- Decide explicitly whether Bubbletea's mouse capture is enabled. On: unlocks future widget interactions. Off: preserves native terminal text-selection/copy-paste, which users will expect by default. Don't leave this as an accidental default either way.\n\n**Out of scope for v1:** ASCII art rendering, sixel/kitty image support, shared widgets, drift mode. Architect the UI with a pluggable \"message renderer\" so these can slot in later without a rewrite.\n\n---\n\n## 6. CLI / Config\n\n**v1 flags (no config file needed yet — keep it simple):**\n\n```\npchat --room \"some passphrase\"       # required: derives topic_id\n      [--ring-size 200]              # scrollback buffer size\n      [--relay-only]                 # force relay, skip hole punching (debug/testing)\n      [--debug]                      # opt-in verbose logging to stderr only, never to disk\n```\n\n- No identity flags — identity is always fresh per launch.\n- No nickname flag — glyph is the identity, on purpose.\n\n---\n\n## 7. Security & Threat Model\n\n**What v1 protects against:**\n- Impersonation within a room (message signing/verification).\n- Casual discovery of a room by outsiders (passphrase-hashed topic).\n\n**What v1 explicitly does NOT protect against (be upfront about this with users):**\n- A participant who joins a room and locally logs/screenshots everything — no protocol can prevent this.\n- Traffic analysis / metadata leakage at the network level (no Tor in v1).\n- Brute-forcing weak/common passphrases to find a room — this is a low bar, not a security boundary. Treat the passphrase like a Discord invite link, not a password.\n- DoS/spam from a malicious peer — no PoW or rate limiting in v1. A basic per-peer message rate cap is a good \"v1.1\" addition even before PoW.\n\n---\n\n## 8. Build & Repo Structure\n\n```\npchat/\n  cmd/pchat/\n    main.go              # CLI entry, flag parsing, wires everything together\n  internal/\n    p2p/\n      host.go            # libp2p host setup, transports, NAT config\n      discovery.go       # mDNS + DHT peer discovery\n      room.go             # topic derivation, gossipsub join/leave\n    protocol/\n      message.go         # Message struct, CBOR encode/decode\n      sign.go            # sign/verify helpers\n    identity/\n      identity.go        # keypair gen, glyph+color derivation\n    ui/\n      model.go           # Bubbletea root model\n      room_view.go       # scrollback rendering\n      input.go           # input bar component\n      roster.go          # presence sidebar\n  go.mod\n  README.md\n```\n\n**Distribution:** single static binary, cross-compiled (goreleaser) for macOS/Linux/Windows, amd64+arm64. No runtime dependencies — this matters for the \"just run it\" feel you want.\n\n---\n\n## 9. Deferred to v2+ (explicitly not in this doc's scope, but keep interfaces open for them)\n\n- Pipe support (`cat file | pchat`) → shared syntax-highlighted blocks\n- Sandboxed code execution + shared output\n- Shared ASCII widgets (whiteboard, counter, tiny games)\n- Drift mode (idle rooms merging)\n- Tor/onion transport toggle\n- Proof-of-work join gating\n- Per-peer rate limiting\n\n---\n\n## 10. Suggested Build Order (for Claude Code sessions)\n\n1. `identity` package — keypair gen + glyph derivation (pure logic, no networking, easy to test standalone).\n2. `protocol` package — Message struct, CBOR encode/decode, sign/verify (also testable in isolation).\n3. `p2p/host.go` — bring up a bare libp2p host, confirm it starts and gets a peer ID.\n4. `p2p/room.go` + `discovery.go` — topic derivation, mDNS join, gossipsub pub/sub, confirm two local processes can talk.\n5. Add DHT discovery for cross-network joins.\n6. `ui/` — Bubbletea shell wired to the p2p layer: send input → publish message; receive message → append to scrollback.\n7. Polish: roster, typing indicators, ring buffer eviction, `--debug` logging.\n\n---\n\n## 11. Open Questions / Known Gaps (decide before or during build — don't let these get silently assumed)\n\n- **Multi-room support:** is one running instance locked to a single room, or can it join several at once? Affects the UI model (would need tabs/panes) and whether the p2p layer needs to manage multiple topic subscriptions concurrently. v1 default assumption unless decided otherwise: **one room per process.**\n- **Message ordering:** gossipsub gives no cross-peer delivery-order guarantee. Bursts of messages may render slightly out of order. Decide whether this matters (likely not, for casual chat) or whether a simple per-sender sequence number should be added to the envelope later for stable local sorting.\n- **Max payload size:** no cap defined yet. Need a hard limit (e.g. 4KB) on the `chat` payload to stop a single peer from flooding scrollback with a huge paste.\n- **Connection churn:** need distinct handling/UI states for \"peer timed out / connection dropped\" vs. \"peer sent an explicit `left` presence message\" — otherwise timeouts will look like silent bugs rather than departures.\n- **Terminal compatibility:** glyph + 256-color rendering needs manual verification across common terminals (iTerm, Windows Terminal, plain Linux tty) — don't assume Lipgloss output looks identical everywhere.\n- **Testing strategy:** no test harness defined yet. Since there's no server, integration tests likely mean spinning up 2–3 libp2p hosts in-process (or via a test helper) and asserting they converge on shared room state, rather than manually testing across terminal windows.\n- **Graceful shutdown:** Ctrl+C / SIGINT should trigger a `presence: left` broadcast before the process exits, not just terminate the connection silently.\n- **Onboarding UX:** a room with no peers yet should show an explicit \"listening for peers...\" state — a blank terminal with no feedback will read as broken rather than working-as-intended.\n- **Passphrase sharing:** the room passphrase is the entire join mechanism, but sharing it is out-of-band by design (link, QR for local demos, pasted in Discord, whatever). Not a code problem — just needs a line in the README so first-time users know how people actually get into the same room together.\n- **Version mismatch UX:** the `v` field lets peers detect incompatible protocol versions, but silently dropping those messages will look like a bug rather than a mismatch. v1 should surface some minimal notice (e.g. \"peer running incompatible version\") rather than just discarding silently.\n- **Empty/whitespace input:** trivial but easy to forget — trim input and ignore empty sends so blank lines don't get published as messages.\n\n---\n\n## 12. Product-Level Considerations (design, not just engineering)\n\n- **The cold-start / discovery paradox:** the core pitch is connecting strangers who don't know each other yet, but the join mechanism requires a pre-shared passphrase — which only works once two people already have a way to coordinate. As-is, the architecture serves private/friend-group rooms well but doesn't solve \"how do weird internet people find each other\" at all. Worth deciding before launch: is there a **public \"commons\" room** — e.g. running `pchat` with no `--room` flag lands you in a well-known default topic — acting as a front door where strangers land, talk, and splinter off into private passphrase rooms from there? Without something like this, the product has no actual cold start.\n- **Abuse & recourse:** the privacy model (no logs, no persistent identity, fully anonymous) is a deliberate strength, but it also means zero consequence for a harasser — reconnecting generates a brand-new keypair, so there's no ban that survives a reconnect and no record of what was said. This needs an explicit product stance, not a silent default. Minimum viable safety valve worth considering for v1: a **local mute** — client-side, session-scoped ignore of a peer's current pubkey — even without any persistent/global ban mechanism.\n\n---\n\n## 13. Architecture & Security Review\n\n### Architecture\n\n- **Redundant identity/signing layer:** libp2p already signs pubsub messages with the peer's own key and carries the PeerID per message. The custom envelope's `sender` + `sig` fields duplicate this. Either drop custom signing and derive the glyph directly from the libp2p PeerID/pubkey, or have a clear reason to keep both — as specified, it's two overlapping signature systems, which is unnecessary attack surface for no real gain.\n- **Gossipsub mesh minimums at small scale:** gossipsub's default mesh parameters (`D_lo`/`D_hi`) are tuned for a reasonable peer count. Rooms of 2–3 peers (which will be common for this use case) may behave differently than gossipsub's design target. Don't assume it \"just works\" at any size — explicitly test 2-peer and 3-peer rooms.\n- **Unbounded connections/resources:** no connection manager limits (watermarks) are specified yet. Without explicit low/high watermarks, a room — or a single hostile peer — could open enough connections to exhaust file descriptors or memory. This needs to be explicit config, not left at library defaults.\n- **CBOR decode limits:** the 4KB payload cap bounds byte size but not structural complexity — a CBOR decoder can still be pointed at deeply nested structures as a DoS vector. Decoder needs explicit max-nesting-depth and max-size guards, not just a payload byte limit.\n\n### Security\n\n- **DHT provider records leak IP addresses by design:** using the passphrase hash as the DHT lookup key means anyone who knows (or brute-forces) a passphrase can query the DHT and obtain participants' IP addresses. Weak/common passphrases are effectively public rooms with exposed IPs. This should be stated plainly and prominently in the README, not buried only in the internal threat-model section — better to be upfront than have someone discover it after the fact.\n- **No replay protection:** signed messages have no nonce or dedupe window. A malicious relay peer could re-broadcast an old signed message later, making it appear freshly sent by someone no longer present. Fix: a short-lived seen-message cache (hash of the signed envelope) plus a timestamp freshness window (reject messages with `ts` outside roughly ±N minutes of local clock).\n- **Zero-cost Sybil attacks:** Ed25519 keypairs are free and instant to generate, so a single person can flood a room with dozens of apparent \"peers.\" PoW gating is deferred to v2 (per §9) — reasonable, but this should be tracked as a known, currently-unmitigated Sybil vector rather than left implicit.\n- **Passphrase exposure via process list:** passing `--room \"passphrase\"` as a CLI argument makes it visible to other users on a shared machine via `ps aux` and similar. Should support an environment variable or interactive stdin prompt as an alternative input method.\n- **Supply chain:** go-libp2p pulls in a large dependency tree. Pin versions and commit `go.sum`; consider signing release binaries (e.g. cosign or minisign). There's no auto-update mechanism, so without signed releases users have no way to verify a downloaded binary matches what was actually built from source.\n\n---\n\n## 14. First-User Perspective (reality check)\n\nNotes from walking through the experience as a brand-new user landing from a launch post, not as the builder. These are the moments that will actually determine whether someone stays past the first 30 seconds.\n\n- **\"Prove it's alive\" is the single biggest churn risk in the product.** A new user typing `pchat --room X` and seeing only \"listening for peers...\" with nothing else will assume it's dead or broken within seconds and tab away — this matters more than almost any technical decision elsewhere in this doc. Ties directly to §5's onboarding-state requirement and §12's cold-start problem: the commons room needs to feel reliably alive, and the maker (or seed users) should be present in it during any launch window, not just architecturally possible to join.\n- **In-app command discoverability is a real gap, not a nice-to-have.** A user who doesn't know `/help` or `/who` exist just sits in front of a bare input bar unsure what's possible. At minimum, placeholder hint text (e.g. `type a message, /help for commands`) should be considered part of v1, not a polish item deferred to later.\n- **Honest positioning matters more than feature completeness.** This product is naturally suited to being a \"drop-in, ephemeral, weird hangout\" experience — not a daily-habit app, since resetting identity every launch works against building return visits or finding specific people again. Marketing and onboarding copy should set this expectation explicitly rather than imply persistence or community continuity the architecture doesn't actually provide. This isn't a flaw to fix — it's a positioning decision to make on purpose (see also the launch checklist's framing guidance).\n- **The IP-exposure caveat (§13) is a trust cliff, not a footnote.** A first-time user who later learns their IP was exposed via an \"obvious\" passphrase, without having been told upfront, won't just be mildly annoyed — they'll feel misled and are likely to warn others off the tool. This reinforces §13's recommendation to state it plainly and prominently, not bury it.\n\n---\n\n## 15. Dev vs. Prod Build Architecture\n\nTwo genuinely separate build artifacts, not one binary with a hidden flag. The goal: it should be **structurally impossible** for dev-only instrumentation to end up in what gets distributed to real users — not just disabled by default, but literally not compiled in.\n\n### Why two artifacts, not a runtime flag\n\nA single binary with `--verbose` or `--debug` is one accidental flag away from leaking logs/metrics in a prod deployment, and it means dev tooling still ships inside every user's download even if switched off. Instead, use **Go build tags** to physically exclude dev-only code from the prod build:\n\n```go\n//go:build dev\n\n// logging.go, metrics.go, debug commands — only compiled into dev builds\n```\n\n```\nmake build-dev    # go build -tags dev ./cmd/pchat\nmake build-prod   # go build ./cmd/pchat   (no tags — dev files aren't even in the binary)\n```\n\n### Dev build — what it includes\n\n- **Structured logging** (e.g. `log/slog` or `zerolog`) to stderr and/or a local file in a temp dir — never inside the prod code path at all.\n- **Metrics endpoint** (Prometheus client, `/metrics` bound to `localhost` only) tracking things like: messages/sec, active peer count, connection count, gossipsub mesh health/score, DHT and rendezvous lookup latency, CBOR encode/decode timing.\n- **pprof endpoint** for CPU/memory profiling during development.\n- **Debug commands** — e.g. dump current peer table, force a DHT lookup, simulate N local peers for mesh-size testing, inject artificial latency/packet loss to test NAT traversal and hole-punching paths without needing real-world flaky networks.\n- **Verbose error messages** — full error chains, stack traces, internal state dumps. Fine in dev, actively bad in prod (see below).\n\n### Prod build — what it strips down to\n\n- **No logging code path at all** — not \"logging disabled,\" but the logging package isn't linked into the binary.\n- **No metrics/pprof endpoints** — nothing listening that wasn't explicitly part of the chat protocol itself. Smaller attack surface, and nothing to accidentally expose if someone runs it on a box with an open port.\n- **No debug commands** — the command set a prod user sees is exactly the v1 command surface (chat, `/help`, `/who`, mute), nothing internal.\n- **Minimal, generic error messages** — a connection failure should say \"couldn't connect, retrying\" to the user, not leak internal state, stack traces, or peer implementation details that could aid an attacker profiling the network.\n- **Hardened defaults locked in, not just recommended** — connection manager watermarks (§13), CBOR decode depth/size guards (§13), timestamp freshness window for replay protection (§13) all on by default with no flag to loosen them in the prod build.\n\n### CI/build pipeline\n\n- Verify the prod build genuinely excludes dev code — e.g. a CI step that greps the compiled binary for known dev-only strings/symbols (like the metrics route path or a log format string) and fails the build if found, rather than trusting the build tag alone.\n- Cross-compile prod releases the same way as described in §8 (goreleaser, signed binaries per §13); dev builds only need to run locally and never need cross-compilation or signing.\n- Keep dev and prod builds in the same repo/module — no code duplication — differentiated purely by build tags on a small number of files (logging, metrics, debug commands), so the core protocol/UI logic is identical between both and dev-testing stays representative of what prod actually runs.\n\n---\n\n## 16. Remaining Gaps (real-world, not engineering)\n\nThese weren't covered by any of the technical passes above and shouldn't be treated as solved just because the rest of the doc is thorough.\n\n- **Operator legal exposure — flagged, not resolved here.** You'll be personally running the rendezvous/relay VPS, for a product explicitly pitched as anonymous, no-logs, \"talk freely about anything.\" Relay traffic is encrypted end-to-end, so you can't see what's proxied through your server — but that same fact is exactly what a liability argument could turn around on you as the operator. This is a real legal question (platform liability, relay/common-carrier-style exposure varies significantly by jurisdiction) and needs an actual conversation with a lawyer before launch, not a policy written into this doc. Don't treat this as closed just because it's now written down.\n- **Open-source license:** none chosen yet. Matters more than usual here since decentralization is part of the pitch — the license affects how freely others can fork the project and stand up their own independent rendezvous points rather than everyone depending on yours.\n- **Windows terminal quirks:** beyond the font/color rendering already noted in §5, `cmd.exe`, PowerShell, and Windows Terminal can differ in raw-mode input handling and ANSI escape support under Bubbletea. Needs explicit testing across all three, not just \"Windows\" as one bucket.\n- **Scaling reality if it takes off:** the v1 architecture assumes a single VPS for rendezvous/relay. If usage grows, relay bandwidth becomes a real cost and that VPS becomes both a bottleneck and a bigger single point of trust/failure. Not a launch blocker, but worth having a rough next-step plan (more relay nodes, letting the community run their own) rather than being caught flat-footed by success.\n- **Acceptable-use stance for the commons room:** since you're the named operator of the default public room, even a no-logs/anonymous design usually benefits from a short, plainly stated policy — if only so you have something to point to if the room's content or use ever gets questioned.\n"}, {"key": "launch", "title": "Launch checklist", "file": "docs/pchat-launch-checklist.md", "md": "# pchat — Launch Checklist\n\n## Before you post anywhere\n\n- [ ] One-liner install works cold, on a clean machine (`go install github.com/you/pchat@latest` or a curl-to-binary script). Test this yourself on a fresh VM/container — don't assume it works because it works on your machine.\n- [ ] Cross-compiled binaries built for macOS (amd64+arm64), Linux (amd64+arm64), Windows (amd64) and attached to a GitHub release.\n- [ ] README has, near the top, in this order:\n  1. One-sentence hook (the feel, not the tech — e.g. \"A chat room that doesn't exist when nobody's in it.\")\n  2. A terminal recording (asciinema link or GIF) showing two people talking, glyphs visible.\n  3. Install command.\n  4. `pchat --room <passphrase>` usage, with the commons-room passphrase called out explicitly.\n- [ ] README states plainly (not buried): passphrase = access, weak passphrases are effectively public with visible IPs via DHT lookups (per §13 of the architecture doc). Don't let someone else discover this and post it as a \"gotcha.\"\n- [ ] Public \"commons\" room decided and named (e.g. `--room launch-day` or similar) — this is your live demo mechanism, not an afterthought.\n- [ ] Basic abuse handling in place: at minimum, local mute works, and graceful Ctrl+C sends a `left` presence so departures don't look like crashes.\n- [ ] Test the 2-peer and 3-peer case specifically (per §13) — this is exactly the scale your first users will hit.\n\n## Assets to have ready\n\n- [ ] Terminal recording / GIF (primary asset — this carries more weight than any written description).\n- [ ] Short Show HN–style title + one paragraph description drafted in advance, not written live under launch pressure.\n- [ ] A couple of screenshots as backup for platforms that don't render GIFs/embeds well (Reddit, some Discords).\n- [ ] Your own glyph/signature ready to reference (\"look for the [glyph] — that's me\") so early visitors have a friendly face to find.\n\n## Launch sequence\n\n- [ ] **Seed first.** Be sitting in the commons room yourself before you post anywhere. Nobody should land in an empty room.\n- [ ] Post order — smallest/friendliest audience first, so you can fix rough edges before the bigger swings:\n  1. A CLI/terminal-tool Discord or small subreddit (r/commandline) — low-stakes test of the install flow and first impressions.\n  2. r/golang — technical crowd, will read the architecture doc if you link it.\n  3. lobste.rs — good fit for the ephemeral/privacy framing.\n  4. Show HN — biggest potential spike, do this once the above have shaken out obvious bugs.\n  5. Twitter/X — thread version of the hook + the recording, tag a few CLI-tool/indiehacker accounts who might reshare.\n- [ ] Space these out (don't post everywhere in the same hour) — you want to be present and responsive in each thread, and a second wave a few days later reads better than one big simultaneous dump.\n- [ ] In every post: lead with the one-sentence hook, not the tech stack. Save libp2p/Noise/Ed25519 details for people who ask or for the linked architecture doc.\n\n## During launch (first 24–48 hours)\n\n- [ ] Stay in the commons room as much as possible — you *are* the onboarding experience right now.\n- [ ] Respond to every comment/thread, especially bug reports — this is a zero-users-to-some-users product, every single early tester matters disproportionately.\n- [ ] Watch for the passphrase/IP-exposure caveat coming up as a question or criticism — you already have the honest answer ready in the README, so point to it rather than getting defensive.\n- [ ] Note every piece of confusion (install friction, unclear commands, silent failures) — these are your v1.1 punch list, not just launch-day noise.\n\n## After the first wave\n\n- [ ] Collect the 3–5 most common questions/confusions and fold fixes into the README or CLI help text directly.\n- [ ] Decide, now that real strangers have used it: does the commons room stay as a permanent front door, or was it launch-only? (Ties back to the cold-start question in §12.)\n- [ ] Revisit the \"Open Questions / Known Gaps\" and \"Product-Level Considerations\" sections of the architecture doc against what actually happened in practice — real usage will answer some of those faster than more planning would.\n"}, {"key": "readme", "title": "README", "file": "README.md", "md": "# pchat\n\nA terminal-only, fully peer-to-peer, **ephemeral** chat tool for developers and internet\nweirdos. No servers, no accounts, no logs — you exist in a room only while you're in it,\nand nothing ever touches disk.\n\n- **Ephemeral by default** — no history, no logs, no saved identity. Quitting loses\n  everything, on purpose.\n- **No central server** — rooms live only as long as a peer holding them is online.\n  Messaging fans out over [libp2p](https://libp2p.io/) gossipsub.\n- **Anonymous but distinguishable identity** — a fresh Ed25519 keypair per launch,\n  rendered as a deterministic **glyph + color** signature. No nicknames — recognition is\n  purely visual.\n- **Rooms are just passphrases** — `topic_id = SHA-256(room_passphrase)`. No passphrase,\n  no way to find or join a room.\n\n> **Status: scaffolded + planned.** This repository currently contains the project\n> structure, tooling, and placeholder packages — **no functionality is implemented\n> yet.** The full v1 build plan (work packages, decisions, execution protocol) lives in\n> [`docs/pchat-implementation-plan.md`](docs/pchat-implementation-plan.md).\n\n## Repository layout\n\n```\npchat/\n  cmd/pchat/\n    main.go              # CLI entry, flag parsing, wires everything together\n  internal/\n    p2p/\n      host.go            # libp2p host setup, transports, NAT config\n      discovery.go       # mDNS + DHT peer discovery\n      room.go            # topic derivation, gossipsub join/leave\n    protocol/\n      message.go         # Message struct, CBOR encode/decode\n      sign.go            # sign/verify helpers\n    identity/\n      identity.go        # keypair gen, glyph+color derivation\n    ui/\n      model.go           # Bubbletea root model\n      room_view.go       # scrollback rendering\n      input.go           # input bar component\n      roster.go          # presence sidebar\n  docs/                  # architecture spec + launch checklist\n  go.mod\n  README.md\n```\n\n## Build & run\n\nRequires **Go 1.23+** (developed against Go 1.26). Common tasks go through the\n[`Makefile`](Makefile) — run `make help` to list targets:\n\n```sh\nmake build                 # compile the ./pchat binary\nmake run ARGS=\"--room foo\"  # build and run (see planned flags below)\nmake test                  # go test ./...\nmake tidy                  # go mod tidy\nmake lint                  # golangci-lint run\n```\n\nOr directly:\n\n```sh\ngo build -o pchat ./cmd/pchat\n./pchat --room \"some passphrase\"\n```\n\n### Planned CLI (v1, not yet implemented)\n\n```\npchat --room \"some passphrase\"   # required: derives the room topic\n      [--ring-size 200]          # in-memory scrollback size\n      [--relay-only]             # force relay, skip hole punching (debug)\n      [--debug]                  # verbose logging to stderr only, never to disk\n```\n\nIdentity is always fresh per launch — there are no identity or nickname flags by design.\n\n### Sharing a room\n\nThe passphrase **is** the entire join mechanism, and sharing it is out-of-band by\ndesign — send it however you'd send a Discord invite link (DM, pasted in chat, QR for a\nlocal demo). Two people in the same room simply ran `pchat` with the same `--room` value.\n\n> ⚠️ **Privacy note:** treat the passphrase like an invite link, not a password. Weak or\n> common passphrases are effectively public rooms, and peer **IP addresses can be exposed**\n> to anyone who knows or guesses the passphrase (via DHT lookups). Message *content* stays\n> end-to-end encrypted, but network metadata does not. See the threat model in the docs\n> below before using pchat for anything sensitive.\n\n## Documentation\n\n- [`docs/pchat-architecture.md`](docs/pchat-architecture.md) — the full architecture and\n  design specification (identity, networking, wire protocol, UI, security & threat model,\n  build order). **This is the source of truth for the project's design.**\n- [`docs/pchat-implementation-plan.md`](docs/pchat-implementation-plan.md) — the v1\n  implementation plan: work packages, dependency graph, decision log, risk register,\n  and the protocol every build session follows.\n- [`docs/pchat-launch-checklist.md`](docs/pchat-launch-checklist.md) — launch checklist\n  and reference material.\n\n## Contributing & security\n\n- Development conventions and the build order live in [`CLAUDE.md`](CLAUDE.md).\n- Security policy and how to report vulnerabilities: [`SECURITY.md`](SECURITY.md).\n\n## License\n\n[MIT](LICENSE) © 2026 Mediacom99\n"}, {"key": "claude", "title": "CLAUDE.md", "file": "CLAUDE.md", "md": "# CLAUDE.md — pchat\n\n## Project overview\n\npchat is a terminal-only, fully peer-to-peer, ephemeral chat tool for developers and\n\"internet weirdos.\" There are no servers, no accounts, and no logs — you exist in a\nroom only while you're in it, and nothing touches disk. Rooms are defined purely by a\nshared passphrase (`topic_id = SHA-256(room_passphrase)`), identity is an anonymous but\ndistinguishable per-session Ed25519 keypair rendered as a glyph+color signature (no\nnicknames), and messaging fans out over libp2p gossipsub. The single hosted component\nis a lightweight rendezvous/relay VPS that never stores anything. v1 is core chat only.\n\n**The source of truth for all design decisions is\n[`docs/pchat-architecture.md`](docs/pchat-architecture.md).** Read the relevant section\nbefore implementing — this file is a map, not a replacement.\n\n**The source of truth for execution is\n[`docs/pchat-implementation-plan.md`](docs/pchat-implementation-plan.md).** It contains\nthe work packages, dependency graph, decision log (with maintainer verdicts), risk\nregister, and the session protocol. Where an APPROVED decision there amends the\narchitecture doc, the plan wins.\n\n## Current status\n\n**Scaffolded + planned; no application code yet.** Every file under `internal/` and\n`cmd/` is a placeholder (package declaration + TODO citing the architecture section).\n`go.mod` intentionally lists **no dependencies** — they are added as each work package\nfirst imports them, at the exact versions pinned in the plan's §3 dependency matrix.\n`go.sum` is empty for the same reason.\n\n**Next step:** follow the implementation plan's §2 Execution protocol — pick the next\neligible work package from its status board (dependencies DONE, gating decisions\nAPPROVED), implement it, run its test plan, update its status. Do not implement\nagainst decisions still marked PROPOSED when the package lists them as gates.\n\n## Repo layout (architecture §8)\n\n```\npchat/\n  cmd/pchat/\n    main.go              # CLI entry, flag parsing, wires everything together\n  internal/\n    p2p/\n      host.go            # libp2p host setup, transports, NAT config\n      discovery.go       # mDNS + DHT peer discovery\n      room.go            # topic derivation, gossipsub join/leave\n    protocol/\n      message.go         # Message struct, CBOR encode/decode\n      sign.go            # sign/verify helpers\n    identity/\n      identity.go        # keypair gen, glyph+color derivation\n    ui/\n      model.go           # Bubbletea root model\n      room_view.go       # scrollback rendering\n      input.go           # input bar component\n      roster.go          # presence sidebar\n  go.mod\n  README.md\n```\n\n## Build order\n\nThe architecture's §10 ordering (identity → protocol → networking → UI) is refined\ninto PR-sized work packages **WP-01 … WP-14** in the implementation plan, which also\ncovers what §10 omits: the rendezvous/relay VPS daemon, the dev/prod build-tag split,\nthe release pipeline, and the README/threat-model work. **Use the plan's status board\nand dependency graph — not this list — to pick work.** Recommended sequential order:\nWP-01, 02, 03, 04, 08 *(LAN-chat milestone)*, 07, 06, 05, 09, 10, 11, 12, 13, 14.\n\n## Key architectural constraints\n\n- **Ephemeral, no disk.** No history, logs, or saved identity — ever. Fresh Ed25519\n  keypair per launch (§1, §2).\n- **Identity = glyph + 256-color**, derived deterministically from the pubkey via a\n  curated, colorblind-safe set. Color is never the only differentiator. No nicknames (§2, §5).\n- **Rooms via passphrase only.** `topic_id = SHA-256(passphrase)` is both the gossipsub\n  topic and DHT key; it is never sent in plaintext. One room per process in v1 (§3, §11).\n- **Transports** TCP + QUIC, Noise security, NAT traversal via AutoNAT + DCUtR hole\n  punching + circuit relay v2 fallback. Discovery order: rendezvous → DHT → mDNS (§3).\n- **Wire format = CBOR** (`fxamacker/cbor`). Shared signed envelope\n  `{v,type,sender,ts,sig,payload}`; every message signed and verified before\n  render/relay (§4). Enforce a payload cap (~4KB) and CBOR decode depth/size guards (§4, §13).\n- **UI** = Bubbletea + Lipgloss; in-memory ring buffer (default 200), pluggable message\n  renderer, explicit SIGWINCH/narrow-terminal handling, send-state feedback (§5).\n- **Security is honest about limits** (§7, §13): no protection against a peer logging\n  the room, metadata/traffic analysis, weak-passphrase brute force, Sybil flooding, or\n  IP exposure via DHT for weak passphrases. Surface these, don't hide them.\n- **Dev vs. prod builds are separate artifacts via build tags** (§15): dev-only\n  logging/metrics/pprof/debug commands live behind `//go:build dev` and must not be\n  compiled into prod. Keep the core path identical between the two.\n- **v2+ is out of scope** (§9) but leave hooks open (PoW as a pubsub validator, Tor as\n  an alternate transport, pluggable renderer for widgets).\n\n## Planned dependencies\n\n`go.mod` starts empty on purpose (see \"Current status\"). Add each dependency with\n`go get` at the moment the first real code imports it — do not pre-add them. The\nauthoritative pin list is the **implementation plan's §3 dependency matrix** (every\nentry there was verified against live sources on 2026-07-09, including compile-and-run\nproofs). Summary:\n\n| Library | Module | Pin (verified 2026-07-09) | Enters at |\n| --- | --- | --- | --- |\n| libp2p host | `github.com/libp2p/go-libp2p` | v0.48.0 | WP-03 (`p2p/host.go`) |\n| gossipsub | `github.com/libp2p/go-libp2p-pubsub` | v0.16.0 (v0.17.0 exists but is hours old — see plan T-32) | WP-04 (`p2p/room.go`) |\n| Kademlia DHT | `github.com/libp2p/go-libp2p-kad-dht` | v0.41.0 (requires exactly go-libp2p v0.48.0) | WP-05 |\n| rendezvous | `github.com/waku-org/go-libp2p-rendezvous` | v0.0.0-20240110193335-a67d1cc760a0 (no tags; pin the pseudo-version) | WP-06 client / WP-07 server |\n| CBOR | `github.com/fxamacker/cbor/v2` | v2.9.2 | WP-02 (`protocol/message.go`) |\n| Bubbletea | `charm.land/bubbletea/v2` | v2.0.8 | WP-08 (`ui/`) |\n| Bubbles (viewport, textinput) | `charm.land/bubbles/v2` | v2.1.1 | WP-08 (`ui/`) |\n| Lipgloss | `charm.land/lipgloss/v2` | v2.0.5 | WP-08 (`ui/`) |\n| terminal (hidden passphrase prompt) | `golang.org/x/term` | latest at import | WP-08 (`cmd/pchat`) |\n| Prometheus client (**dev builds only**) | `github.com/prometheus/client_golang` | latest at import | WP-11 (`internal/devtools`) |\n\nNotes:\n\n- **Charm stack is the v2 line at `charm.land/*` vanity paths** (plan decision T-31).\n  The Charm libraries went v2-stable 2026-02-24 under new import paths — do **not**\n  use `github.com/charmbracelet/bubbletea` (frozen v1 line, previously pinned here) or\n  `github.com/charmbracelet/*/v2` (stale path — mixing it with `charm.land` compiles\n  two incompatible copies of bubbletea). Bubbletea ≥ v2.0.7 is required (Windows\n  resize regression fixed there).\n- **Rendezvous uses a maintained fork, not the spec's named module.** §3 names\n  `github.com/libp2p/go-libp2p-rendezvous`, but that repo is **dead** — its `master`\n  branch was stripped of all Go code (only CI/stale-bot commits remain), so `@latest`\n  has no importable package; the only real code is a 2021-era `implement-spec` branch\n  needing the deprecated `go-libp2p-core`. go-libp2p **itself is very actively\n  maintained** (monthly releases, v0.48.0); the core protocols were consolidated into\n  that monorepo (`p2p/protocol/{identify,ping,holepunch,circuitv2,autonatv2}`), but\n  rendezvous — whose spec is still only a 2021 \"Working Draft\" — was never migrated and\n  its satellite repo was orphaned. The actively maintained continuation is the **Waku\n  fork** `github.com/waku-org/go-libp2p-rendezvous` (used in production by Waku/Status).\n  NB: `go-waku-rendezvous` is a *different*, spec-incompatible variant (20s TTL) — do\n  not use that one.\n- **The fork's root package is cgo-free — import it directly.** An earlier note here\n  claimed the root package pulls in `mattn/go-sqlite3` (cgo); that was **verified\n  wrong** on 2026-07-09 (`go list -deps` shows no sqlite, no `database/sql`; the whole\n  client+server built and ran with `CGO_ENABLED=0` against go-libp2p v0.48.0). The cgo\n  sqlite/sqlcipher drivers live in the `db/sqlite` / `db/sqlcipher` subpackages —\n  simply never import those. The VPS daemon uses a hand-written in-memory\n  implementation of the fork's storage interface (plan WP-07).\n- **Fork risk is pre-decided.** If the fork ever fails the WP-06 opening spike, the\n  pre-approved contingency in plan decision T-12 applies (v1 ships DHT+mDNS discovery;\n  VPS stays relay-only) — no session should stall on this.\n- **Never add `replace` directives to go.mod** — they break\n  `go install github.com/Mediacom99/pchat/cmd/pchat@latest` (verified; the launch\n  checklist depends on that path). The fork resolves under its own module path and\n  needs none.\n\n## Common commands\n\nRun via the Makefile (`make help` lists targets):\n\n- `make build` — compile the `pchat` binary (`go build -o pchat ./cmd/pchat`).\n- `make run ARGS=\"--room foo\"` — build and run.\n- `make test` — `go test ./...`.\n- `make tidy` — `go mod tidy`.\n- `make lint` — `golangci-lint run` (config in `.golangci.yml`).\n\nCI (`.github/workflows/ci.yml`) runs build, vet, test, and golangci-lint on push and PR.\n\n## Documentation\n\n- [`docs/pchat-architecture.md`](docs/pchat-architecture.md) — **source of truth for\n  design intent**: architecture, wire protocol, security model.\n- [`docs/pchat-implementation-plan.md`](docs/pchat-implementation-plan.md) — **source\n  of truth for execution**: work packages, dependency graph, decision log (maintainer\n  verdicts live here), risk register, session protocol + kickoff prompt.\n- [`docs/pchat-launch-checklist.md`](docs/pchat-launch-checklist.md) — launch checklist\n  (reference).\n- [`docs/pchat-overview.html`](docs/pchat-overview.html) — the maintainer's\n  single-page, self-contained reading copy of all the docs above (open locally in a\n  browser). **Generated — never edit by hand.** After editing ANY markdown doc in\n  this list (or README.md / this file), run `make overview` and commit the\n  regenerated HTML in the same commit. Generator: `docs/tools/build-overview.py`\n  (stdlib-only; renders via the vendored `docs/tools/marked.min.js`).\n"}]</script>
<script>
(function () {
  const DOCS = JSON.parse(document.getElementById('docs-data').textContent);
  const byFile = {};   // "pchat-architecture.md" -> key
  DOCS.forEach(d => { byFile[d.file.split('/').pop().toLowerCase()] = d.key; });

  // --- GitHub-compatible heading slugs (must match the anchors used in the docs)
  function slugger() {
    const used = new Set();
    return function (text) {
      let s = text.toLowerCase().trim()
        .replace(/[^\p{L}\p{N}\s_-]/gu, '')
        .replace(/\s/g, '-');
      let base = s, i = 1;
      while (used.has(s)) s = base + '-' + (i++);
      used.add(s);
      return s;
    };
  }

  marked.use({ gfm: true, breaks: false, mangle: false });

  const main = document.getElementById('main');
  const tabs = document.getElementById('tabs');
  const toc = document.getElementById('toc');
  const tocByKey = {};

  DOCS.forEach(doc => {
    const art = document.createElement('article');
    art.id = 'doc-' + doc.key;
    art.innerHTML = '<div class="srcpath">' + doc.file + '</div>' + marked.parse(doc.md);
    main.appendChild(art);

    // heading ids, prefixed per doc so slugs never collide across docs
    const slug = slugger();
    const heads = art.querySelectorAll('h1, h2, h3, h4, h5');
    heads.forEach(h => { h.id = doc.key + '--' + slug(h.textContent); });

    // wrap tables for horizontal scroll
    art.querySelectorAll('table').forEach(t => {
      const w = document.createElement('div'); w.className = 'tblwrap';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    // rewrite links: in-doc anchors, cross-doc .md links, external targets
    art.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (href.startsWith('#')) {
        a.setAttribute('href', '#' + doc.key + '--' + href.slice(1));
        a.dataset.doc = doc.key;
      } else if (/\.md(#|$)/i.test(href)) {
        const m = href.match(/([^\/]+\.md)(?:#(.*))?$/i);
        const target = m && byFile[m[1].toLowerCase()];
        if (target) {
          a.setAttribute('href', m[2] ? '#' + target + '--' + m[2] : '#doc-' + target);
          a.dataset.doc = target;
        }
      } else if (/^https?:/i.test(href)) {
        a.target = '_blank'; a.rel = 'noopener';
      }
    });

    // per-doc TOC (h2 + h3)
    const frag = document.createDocumentFragment();
    art.querySelectorAll('h2, h3').forEach(h => {
      const a = document.createElement('a');
      a.href = '#' + h.id; a.dataset.doc = doc.key;
      a.textContent = h.textContent;
      if (h.tagName === 'H3') a.className = 'h3';
      frag.appendChild(a);
    });
    tocByKey[doc.key] = frag;

    const btn = document.createElement('button');
    btn.textContent = doc.title; btn.dataset.doc = doc.key;
    btn.addEventListener('click', () => { activate(doc.key); window.scrollTo(0, 0); });
    tabs.appendChild(btn);
  });

  function activate(key) {
    document.querySelectorAll('article').forEach(a => a.classList.toggle('active', a.id === 'doc-' + key));
    tabs.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.doc === key));
    toc.replaceChildren(tocByKey[key].cloneNode(true));
    document.getElementById('nav').classList.remove('open');
  }

  // any click on a doc-targeting link activates the right tab first
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-doc]');
    if (!a) return;
    activate(a.dataset.doc);
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) { e.preventDefault(); el.scrollIntoView(); history.replaceState(null, '', '#' + id); }
  });

  // deep link support: #dockey--heading or #doc-dockey
  function fromHash() {
    const h = location.hash.slice(1);
    if (!h) { activate(DOCS[0].key); return; }
    const key = h.startsWith('doc-') ? h.slice(4) : h.split('--')[0];
    activate(DOCS.some(d => d.key === key) ? key : DOCS[0].key);
    const el = document.getElementById(h);
    if (el) setTimeout(() => el.scrollIntoView(), 0);
  }
  fromHash();

  document.getElementById('menu-btn').addEventListener('click',
    () => document.getElementById('nav').classList.toggle('open'));
  document.getElementById('theme-btn').addEventListener('click', () => {
    const r = document.documentElement;
    const dark = (r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('pchat-theme', r.dataset.theme); } catch (e) {}
  });
  try {
    const saved = localStorage.getItem('pchat-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
})();
</script>

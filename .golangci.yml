# golangci-lint configuration (schema v2).
# Run via `make lint` (golangci-lint run) and in CI.
version: "2"

run:
  # Build tag for dev-only instrumentation files (logging, metrics, debug
  # commands) kept behind `//go:build dev` so they never ship in prod builds.
  build-tags:
    - dev

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Mediacom99/askrelay
